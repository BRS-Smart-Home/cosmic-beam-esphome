# Blumfeldt (Klarstein) Cosmic Beam (non-smart, display board "ZD-90F") -> ESPHome thermostat
# Board: ESP32-C3 Super Mini
# Full guide, wiring and safety notes: README.md
#
# Wiring summary (see README for the trace cut on R16):
#   VDD (+5 V)            -> 5V        VSS (GND) -> G
#   R16, U1-side pad      -> GPIO5     heater relay via Q6 (white wire)
#   NTC upper pin (by C5) -> GPIO3     heater's own room sensor (listen only)
#   IR receiver OUT       -> GPIO6     inject remote code into U1 (display sync)
#   IR receiver OUT       -> GPIO7     listen for real remote presses (optional)
#
# NEVER connect USB to the ESP while the heater is plugged into the mains.

substitutions:
  name: cosmic-beam          # hostname: lowercase, digits, hyphens
  friendly_name: Cosmic Beam # shown in Home Assistant
  # Optional: a Home Assistant temperature sensor, shown alongside (not used for control)
  room_sensor: sensor.replace_me

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 800
      then:
        - output.turn_off: out_main
    - priority: -100
      then:
        - delay: 5s
        # Heater power cut -> U1 restarted in standby, so forget the stored display state
        - lambda: |-
            std::string r = id(reset_reason).state;
            if (r.find("ower") != std::string::npos || r.find("rownout") != std::string::npos) {
              id(u1_on) = false;
            }
        - script.execute: sync_display

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

debug:

api:
  id: api_server
  encryption:
    key: !secret cosmic_beam_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB        # fixes "Auth Expired" on many ESP32-C3 Super Mini boards
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret cosmic_beam_ap_password

captive_portal:

# ---------- State ----------
globals:
  - id: u1_on            # does U1 (the display) currently think it is ON?
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: self_tx          # true while the ESP itself is sending (ignore its own echo)
    type: bool
    initial_value: 'false'

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason
      name: "Reset reason"

# ---------- Output: Q6 / white wire = heater relay (via R16) ----------
output:
  - platform: gpio
    id: out_main
    pin: GPIO5

# ---------- IR into U1 (GPIO6 and GPIO7 both on the IR receiver OUT leg) ----------
remote_receiver:
  pin:
    number: GPIO7
    inverted: true
    mode:
      input: true
      pullup: false
  on_nec:
    then:
      - if:
          condition:
            lambda: 'return x.address == 0xFF00 && x.command == 0xAD52 && !id(self_tx);'
          then:
            - lambda: 'id(u1_on) = !id(u1_on);'   # a real remote toggled the display

remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO6
    inverted: true
    mode:
      output: true
      open_drain: true
  carrier_duty_percent: 100%

# ---------- Temperature ----------
sensor:
  # Optional Home Assistant sensor, display only (delete this block if unused)
  - platform: homeassistant
    id: room_temp
    name: "Room temperature (HA)"
    entity_id: ${room_sensor}

  # Heater's own NTC: 5 V -> NTC -> GPIO3 -> R10 (10k) -> GND
  - platform: adc
    id: ntc_voltage
    pin: GPIO3
    attenuation: 12db
    update_interval: 10s
    filters:
      - median:
          window_size: 6
          send_every: 6

  - platform: resistance
    id: ntc_resistance
    sensor: ntc_voltage
    configuration: UPSTREAM
    resistor: 10kOhm
    reference_voltage: 5.0V

  - platform: ntc
    id: heater_temp
    name: "Heater sensor temperature"
    sensor: ntc_resistance
    calibration:               # calibrated on one unit - see README to recalibrate yours
      b_constant: 3950
      reference_temperature: 20C
      reference_resistance: 13kOhm
    filters:
      - delta: 0.1
    on_value:
      # Sensor fault, or ADC at its ~32 C limit -> force OFF
      - if:
          condition:
            lambda: 'return isnan(x) || x < 0.0 || x > 31.5;'
          then:
            - climate.control:
                id: heater
                mode: "OFF"
            - logger.log: "Heater sensor fault or at limit - heater forced OFF"

# ---------- Thermostat (controlled by the heater's own sensor) ----------
climate:
  - platform: thermostat
    id: heater
    name: "Heater"
    sensor: heater_temp
    on_boot_restore_from: default_preset   # always start OFF after boot / power cut
    min_heating_off_time: 5s
    min_heating_run_time: 5s
    min_idle_time: 5s
    heat_deadband: 0.4
    heat_overrun: 0.4
    visual:
      min_temperature: 5
      max_temperature: 30
      temperature_step: 0.5
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20
        mode: "OFF"
    heat_action:
      - output.turn_on: out_main
      - script.execute: max_run_guard
    idle_action:
      - output.turn_off: out_main
      - script.stop: max_run_guard
    off_mode:
      - output.turn_off: out_main
      - script.stop: max_run_guard
    on_state:
      - script.execute: sync_display

# ---------- Display sync + safety scripts ----------
script:
  - id: send_power
    mode: single
    then:
      - globals.set:
          id: self_tx
          value: 'true'
      - remote_transmitter.transmit_nec:
          transmitter_id: ir_tx
          address: 0xFF00
          command: 0xAD52
      - lambda: 'id(u1_on) = !id(u1_on);'
      - delay: 500ms
      - globals.set:
          id: self_tx
          value: 'false'

  - id: sync_display
    mode: single
    then:
      - if:
          condition:
            lambda: 'return (id(heater).mode == climate::CLIMATE_MODE_HEAT) != id(u1_on);'
          then:
            - script.execute: send_power
            - script.wait: send_power

  # One heating run may not last longer than 3 h without a break
  - id: max_run_guard
    mode: restart
    then:
      - delay: 3h
      - climate.control:
          id: heater
          mode: "OFF"
      - logger.log: "Max continuous heating time reached - heater forced OFF"

button:
  - platform: template
    name: "Display: resync"
    on_press:
      - script.execute: send_power

# ---------- Safety: OFF if Home Assistant unreachable for 5 min ----------
# Delete this block if the heater should keep regulating on its own without HA.
interval:
  - interval: 30s
    then:
      - lambda: |-
          static uint32_t lost_since = 0;
          if (id(api_server).is_connected()) {
            lost_since = 0;
          } else {
            if (lost_since == 0) lost_since = millis();
            if (millis() - lost_since > 5UL * 60UL * 1000UL) {
              auto call = id(heater).make_call();
              call.set_mode("OFF");
              call.perform();
            }
          }
